<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <figure>
        <img src="images/biryani.jpg" alt="Chicken biryani served in a traditional dish">
    </figure>

    <figure>
        <img src="images/biryani.jpg" alt="Chicken biryani served in a traditional dish">
        <figcaption>
            Our famous traditional chicken biryani.
        </figcaption>
    </figure>


    <!-- Real Restaurant Gallery -->
    <h1>Royal Taste Restaurant</h1>
    <h2>Food Gallery</h2>
    <figure>
        <img src="images/biryani.jpg" alt="Chicken biryani" width="500" height="350">
        <figcaption>Traditional Chicken Biryani</figcaption>
    </figure>
    <figure>
        <img src="images/pizza.jpg" alt="Cheese pizza" width="500" height="350">
        <figcaption>Special Cheese Pizza</figcaption>
    </figure>



    <!-- Responsive/alternative image sources ke liye: -->
    <picture>
        <source media="(max-width: 600px)" srcset="images/food-small.jpg">
        <img src="images/food-large.jpg" alt="Restaurant special dish">
    </picture>
    <!-- Concept: -->
    <!-- Desktop → large image -->
    <!-- Mobile → small image -->
    <!-- Ye responsive images ke advanced concepts mein important hai. -->


    <audio controls>
        <source src="audio/restaurant.mp3" type="audio/mpeg">
    </audio>
    <!-- controls browser ko playback controls provide karne ke liye kehta hai.User ko generally: ▶ Play ,  Volume , Progress jaisi controls mil sakti hain. -->


    <!-- Multiple Audio Sources -->
    <audio controls>
        <source src="audio/music.mp3" type="audio/mpeg">
        <source src="audio/music.ogg" type="audio/ogg">
        Your browser does not support audio playback.
    </audio>
    <!-- Browser suitable source choose karne ki koshish karta hai. -->


    <video controls width="800">
        <source src="videos/restaurant-tour.mp4" type="video/mp4">
    </video>

    <!-- Important attributes: controls , autoplay , muted , loop , poster , width , height , preload -->
    <video controls width="800" poster="images/restaurant-poster.jpg">
        <source src="videos/tour.mp4" type="video/mp4">
    </video>

    <!-- Video play hone se pehle preview image: -->
    <video controls poster="images/restaurant.jpg"></video>

    <video controls>
        <source src="videos/restaurant-tour.mp4" type="video/mp4">
        <track kind="captions" src="captions-en.vtt" srclang="en" label="English">
    </video>

    <iframe src="MAP_EMBED_URL" title="Royal Taste Restaurant location" width="600" height="450" loading="lazy">
    </iframe>

    <iframe src="..." title="Restaurant location map">
    </iframe>
    <!-- title iframe ko accessible name provide karne mein help karta hai. -->

    <!-- loading="lazy" -->
    <iframe src="..." loading="lazy">
    </iframe>
    <!-- Lazy loading ka idea: Resource ko tab load karo jab uski zarurat/viewport ke qareeb aaye. -->
    
    <!-- Images par bhi: useful ho sakta hai. -->
    <img src="images/gallery.jpg" alt="Restaurant interior" loading="lazy">



</body>

</html>
