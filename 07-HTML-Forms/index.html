<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <!-- action — Data kis URL/server endpoint par jayega.
    method — Data kis HTTP method se submit hoga.s -->
    <form action="/submit" method="post" border="2px solid black">

        <label>Name</label>
        <input type="text" placeholder="Enter Your Name...">

        <button type="submit">Submit</button>

        </br></br>

        <!-- <label> aur id/for Relationship  -->
        <label for="student-name">Student Name</label>
        <input type="text" id="student-name" placeholder="Enter Your Name..." name="Full Name">

        </br></br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Your Email.." name="email">

        </br></br>

        <label for="password">Password</label>
        <input required type="password" id="password" placeholder="Enter Your Password" name="password">

        </br></br>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter Your Age" name="age" min="16" max="60">

        </br></br>

        <label for="DoB">Date Of Birth</label>
        <input required type="datetime-local" id="DoB" placeholder="Enter Your Date Of Bith" name="DoB" min="1-1-2015"
            max="1-1-1980">
        </br></br>

        <label for="tel">Phone Number</label>
        <input type="tel" id="tel" placeholder="+92 313 1234567" name="phone">

        </br></br>

        <label for="url">Enter Your Website URL</label>
        <input type="url" id="url" placeholder="https://www.example.com" name="website">
        </br></br>

        <label for="uni">Enter Your University Name</label>
        <input type="text" id="uni" required placeholder="University name...." name="university" minlegth="10"
            maxlength="50">
        </br></br>

        <label>Select Programming Languages: </label>
        <input type="checkbox" id="box2" name="programming" value="HTML">
        <label for="box2"> HTML</label>
        <input type="checkbox" id="box3" name="programming" value="CSS">
        <label for="box3"> CSS</label>
        <input type="checkbox" id="box" name="programming" value="JavaScript">
        <label for="box"> JavaScript</label>
        </br></br>

        <label>Select Your Gender: </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male"> Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female"> Female</label>
        </br></br>

        <label for="department">Department</label>
        <select id="department" name="department">
            <option value="software-engineering" disabled>Software Engineering</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
        </select>

        </br></br>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="5" cols="40"></textarea>
        </br></br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset Form</button>
        <button type="button">Click Me</button>

        </br></br>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name</label>
            <input type="text" id="name">
        </fieldset>

    </form>


</body>

</html>
